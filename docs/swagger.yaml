          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - ApiKeyAuth: []
      summary: Обновить заявку
      tags:
      - fuel_consumptions
  /api/fuel_consumptions/{id}/finish:
    put:
      consumes:
      - application/json
